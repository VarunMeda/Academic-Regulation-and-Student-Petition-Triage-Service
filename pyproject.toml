[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-petition-triage"
version = "0.1.0"
description = "Evidence-backed academic petition triage service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139,<0.140",
  "pydantic>=2.13,<2.14",
  "uvicorn[standard]>=0.35,<0.36",
  "prometheus-client>=0.23,<0.24",
]

[project.optional-dependencies]
full = ["langgraph>=1.2,<1.3", "langchain-core>=1.7,<1.8", "sentence-transformers>=5.6,<5.7", "transformers>=4.57,<4.58", "torch>=2.5,<2.6", "faiss-cpu>=1.15,<1.16", "numpy>=1.26,<2", "redis>=5.2,<5.3", "pypdf>=6,<7"]
test = ["pytest>=9,<10", "httpx>=0.28,<0.29"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

