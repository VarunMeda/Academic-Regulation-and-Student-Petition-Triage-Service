services:
  api:
    build: .
    ports: ["8000:8000"]
    environment: ["DATABASE_PATH=/service/data/triage.db", "INDEX_PATH=/service/data/index.json"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build: .
    command: ["python", "-m", "http.server", "8081"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081')"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    depends_on: [api]

