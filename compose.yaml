services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_PATH: /service/runtime/triage.db
      INDEX_PATH: /service/data/index.json
      QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    volumes: ["run-data:/service/runtime"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_PATH: /service/runtime/triage.db
      INDEX_PATH: /service/data/index.json
      QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    volumes: ["run-data:/service/runtime"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [api, worker]

volumes:
  run-data:
